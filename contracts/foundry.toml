[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# Every top-level call in a test is its own transaction (Foundry's default since 1.8). Pinned so
# local and CI agree without a flag. Nothing in the tree depends on two top-level calls sharing a
# transaction any more: the Pyth adapter's same-transaction gate was removed (audit wave 2,
# P-MED-1 / P-LOW-1) and the suite is green in both modes — `--no-isolate` is also green.
isolate = true

remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
]

[invariant]
runs = 256
depth = 40
fail_on_revert = false
call_override = false

[fuzz]
runs = 512

[fmt]
line_length = 100

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Offline containers with a pre-fetched compiler: `FOUNDRY_PROFILE=local forge test`
# Halmos compiles the project through `forge build` before it runs; on CI's 2-core / 7 GB runner a
# via-IR compile of every test contract never finishes (ci.yml, the contracts jobs), so the halmos
# steps run with FOUNDRY_PROFILE=halmos and compile src + the two harnesses only. Everything else
# inherits from the default profile.
[profile.halmos]
test = "test/halmos"
# Foundry 1.8 defaults `dynamic_test_linking` to true (`forge config` on the default profile: True),
# which compiles every `new X(...)` in a test contract into `vm.deployCode("X", args)`; halmos has no
# deployCode cheat and its first CI run failed in setUp() on exactly that ("Unsupported cheat code:
# deployCode(string,bytes)", 2026-09-12). Off here, the harnesses compile with plain CREATE.
dynamic_test_linking = false

[profile.local]
solc = "/root/.solc/solc-0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
isolate = true
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[lint]
lint_on_build = false
