[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
]

[invariant]
runs = 256
depth = 40
fail_on_revert = false
call_override = false

[fuzz]
runs = 512

[fmt]
line_length = 100

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Offline containers with a pre-fetched compiler: `FOUNDRY_PROFILE=local forge test`
[profile.local]
solc = "/root/.solc/solc-0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
