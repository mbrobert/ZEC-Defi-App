# Oilskin Solana module — Anchor workspace. Design: docs/SOLANA-ARCHITECTURE.md. Facts: docs/VERIFIED-SOLANA-FACTS.md.
# Localnet only. There is no devnet ZCASH market; the mainnet programs and accounts are cloned into the local
# validator (list below, every address from docs/VERIFIED-SOLANA-FACTS.md). Nothing here deploys anywhere.

[toolchain]
anchor_version = "1.2.0"   # crates.io max_stable for anchor-lang / anchor-cli on 2026-09-12; npm client @anchor-lang/core 1.2.0
solana_version = "4.2.2"   # Agave stable release of 2026-08-28

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Anchor's placeholder id. `anchor keys sync` replaces it at the first build with the keypair it writes to
# target/deploy/oilskin-keypair.json — gitignored, never committed, never read into a Claude session.
oilskin = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
# The founder's local CLI keypair. Claude Code is denied this path (.claude/settings.json).
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false

[test.validator]
url = "https://api.mainnet-beta.solana.com"   # clone source; a keyed RPC (SOLANA_RPC_URL) is kinder to the rate limit
ledger = ".anchor/test-ledger"
bind_address = "127.0.0.1"

# ---- programs (program account + its programdata account, so the upgradeable loader can execute them) ----
