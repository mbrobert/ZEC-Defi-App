[toolchain]
anchor_version = "1.2.0"
solana_version = "4.2.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
oilskin = "Gw2UE3MixYgA8c7nLZC9UF2z3z5dWfzrFW7ESmi5Scog"
# mock_scope (LOCALNET ONLY) is NOT listed: scripts/localnet.sh loads target/deploy/mock_scope.so at Scope's own id
# HFn8GnPADiny6XqUoWE8uRPPxb29ikn4yTuPa9MF2fWJ at genesis; the tests open it from target/idl/mock_scope.json.

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 --exit 'tests/*.spec.ts'"

[hooks]

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
url = "https://api.mainnet-beta.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899

