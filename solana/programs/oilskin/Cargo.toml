[package]
name = "oilskin"
version = "0.1.0"
description = "Oilskin Solana module — program-owned Kamino obligation with a scoped, revocable keeper grant (scaffold; no handlers until docs/SOLANA-ARCHITECTURE.md is approved)"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "oilskin"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# crates.io max_stable on 2026-09-12 (anchor-lang / anchor-spl / anchor-cli all 1.2.0; the 2.0.0-rc line is not stable).
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token", "associated_token"] }
