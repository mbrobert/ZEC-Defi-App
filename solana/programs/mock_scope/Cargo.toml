[package]
name = "mock_scope"
version = "0.1.0"
description = "LOCALNET ONLY. A stand-in loaded at Scope's program id so tests can stamp Kamino's oracle prices fresh and move them. Never deployed anywhere real; not part of the audited surface."
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_scope"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.2.0"
