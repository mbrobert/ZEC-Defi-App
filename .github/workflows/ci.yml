name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fetch libraries (not vendored in repo)
        run: |
          git clone --depth 1 --branch v5.7.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std lib/forge-std
      - name: Unit + scenario + invariant suites
        run: forge test -vv

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci = reproducible installs pinned by the committed package-lock.json
      # (unpinned `npm install` let every CI run and demo machine resolve its
      # own dependency tree).
      - name: Install (shared + agent + yield workspaces, from lockfile)
        run: npm ci -w @zyo/shared -w @zyo/agent -w @zyo/yield
      # Visibility without flake: report known vulns in production deps, but
      # never fail the build on an upstream advisory landing overnight.
      - name: Audit production dependencies (non-blocking)
        run: npm audit --omit=dev --audit-level=high || true
      # agent and yield import @zyo/shared's compiled dist/ — a fresh runner
      # has none, so build it first (this missing step failed every run
      # 2026-08-14 → 2026-08-27).
      - name: Build shared
        run: npm run build -w @zyo/shared
      - name: Agent suite (tsc + node:test)
        run: npm test -w @zyo/agent
      - name: Yield service suite (tsc + node:test, offline fixtures)
        run: npm test -w @zyo/yield
