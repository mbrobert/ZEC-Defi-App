name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Slice L (2026-09-13): dispatchable by hand, so a run can be re-taken without a commit — the
  # `fork` job's verification was blocked for two days first by the missing `BASE_RPC_URL` secret
  # and then by a queued run that predated it (secrets are read when the job starts, and that one
  # started three minutes before the secret was created).
  workflow_dispatch:

# Slice I (2026-09-12): CI that proves what it claims. Every area has its own job; a job never runs
# a suite without the inputs that suite needs (the keeper's ABI seam is STRICT here, so it can no
# longer print SKIP and stay green); the fork job says "NOT VERIFIED" — and fails — when the RPC
# secret is absent, instead of showing a green check over skipped tests. The nightly invariant run
# lives in nightly-invariants.yml. Counts for every suite: docs/TESTING.md.
env:
  # The block EVERY fork read is pinned to — the forge fork suite and scripts/check-cbzec-b20.sh
  # alike. Read on 2026-09-12 17:34 UTC from https://mainnet.base.org (docs/TESTING.md "Contracts,
  # fork" records what passed there). Move it forward deliberately: re-run, then record the new
  # block. An RPC that no longer serves state at this block fails the job with its own error.
  FORK_BLOCK: "51222568"
  # Library pins (not vendored in the repo — SETUP.md).
  OZ_TAG: v5.7.0
  FORGE_STD_TAG: v1.16.2

jobs:
  # The suites run as three jobs, one per test group, because the private repository's standard
  # runner (2 cores, 7 GB) never finishes a via-IR compile of the whole tree: the fork job compiles
  # the 108 files it needs in ~96 s on the same runner, while the full 138 — the ten top-level test
  # contracts, the 19 audit regressions and the invariant handler on top — ended seven jobs in a row
  # at 11–14 min with "the runner has received a shutdown signal" (exit 143), after a fallback-restored
  # cache and cold alike (2026-09-12, CHANGELOG). `--match-path` makes forge compile only the matched
  # tests and their dependencies, so each job's compile stays inside what the runner has, and one solc
  # at a time (`--threads 1`) keeps the peak memory of the biggest test contracts to one process.
  # docs/TESTING.md "Contracts" lists the three groups and their counts; together they are the suite.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # forge's `*` crosses directory separators, so the top-level group excludes the sub-directories
        # by name (measured with `forge test --list`: unit 9 files / 250 tests, regressions 17 / 132,
        # invariant 1 / 11 on 2026-09-12; the fork tests have their own job, halmos its own steps).
        group:
          - { name: unit, args: '--match-path "test/*.t.sol" --no-match-path "test/{audit-regressions,invariant,fork,halmos}/**"' }
          - { name: audit-regressions, args: '--match-path "test/audit-regressions/*.t.sol"' }
          - { name: invariant, args: '--match-path "test/invariant/*.t.sol"' }
    name: contracts (${{ matrix.group.name }})
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fetch libraries (not vendored in repo)
        run: |
          git clone --depth 1 --branch "$OZ_TAG" https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 --branch "$FORGE_STD_TAG" https://github.com/foundry-rs/forge-std lib/forge-std
      - name: Runner resources (evidence for the shutdown signals)
        run: nproc; free -h; df -h . | tail -1
      - name: Restore the compiler cache (per group, keyed on every .sol and foundry.toml)
        uses: actions/cache@v4
        with:
          path: |
            contracts/cache
            contracts/out
          key: foundry-${{ runner.os }}-${{ matrix.group.name }}-${{ hashFiles('contracts/foundry.toml', 'contracts/src/**/*.sol', 'contracts/test/**/*.sol', 'contracts/script/**/*.sol') }}
          restore-keys: foundry-${{ runner.os }}-${{ matrix.group.name }}-
      - name: forge test — ${{ matrix.group.name }} (isolation pinned in foundry.toml; compiles only this group and its dependencies)
        run: forge test -vv --threads 1 ${{ matrix.group.args }} | tee "test-${{ matrix.group.name }}.log"
      - name: Totals into the run summary
        if: always()
        run: |
          # Foundry's closing line: "Ran N test suites in …: P tests passed, F failed, S skipped (T total tests)"
          TOTALS=$(sed -n 's/^Ran [0-9]* test suites\{0,1\} in .*: \([0-9]*\) tests\{0,1\} passed, \([0-9]*\) failed, \([0-9]*\) skipped (\([0-9]*\) total tests\{0,1\}).*/\1 \2 \3 \4/p' "test-${{ matrix.group.name }}.log" | tail -1)
          if [ -z "$TOTALS" ]; then
            echo "::error::contracts (${{ matrix.group.name }}): forge printed no totals line — the group did not run to the end"
            echo "### contracts (${{ matrix.group.name }}): NOT RUN TO THE END" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          read -r PASSED FAILED SKIPPED TOTAL <<< "$TOTALS"
          LINE="contracts (${{ matrix.group.name }}): ${PASSED} passed / ${FAILED} failed / ${SKIPPED} skipped of ${TOTAL}"
          echo "$LINE"
          echo "### $LINE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" -ne 0 ]; then echo "::error::$LINE"; exit 1; fi

  # One compile of the PRODUCT contracts, shared with the seam jobs below: the keeper's and the root's
  # ABI checks read contracts/out/, and a fresh runner has none (the keeper job printed "verify-abi:
  # SKIP" on every run before 2026-09-12 — green, and proving nothing). Tests are skipped here on
  # purpose: they are what the runner cannot compile in one go (see the contracts jobs), and the seam
  # reads product artifacts only.
  contracts-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fetch libraries (not vendored in repo)
        run: |
          git clone --depth 1 --branch "$OZ_TAG" https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 --branch "$FORGE_STD_TAG" https://github.com/foundry-rs/forge-std lib/forge-std
      - name: Restore the compiler cache (product contracts and scripts)
        uses: actions/cache@v4
        with:
          path: |
            contracts/cache
            contracts/out
          key: foundry-${{ runner.os }}-build-${{ hashFiles('contracts/foundry.toml', 'contracts/src/**/*.sol', 'contracts/script/**/*.sol') }}
          restore-keys: foundry-${{ runner.os }}-build-
      - name: forge build (src and script; tests compile in the contracts jobs)
        run: forge build --skip test
      - name: Upload the artifacts for the seam jobs
        uses: actions/upload-artifact@v4
        with:
          name: contracts-out
          path: contracts/out
          retention-days: 1
          if-no-files-found: error

  # The machine-checked seam between contracts and every other area: contracts/abi/oilskin-abi.json
  # must equal the compiled artifacts (exit 1 on drift), and the keeper's own seam must run against
  # the same artifacts with nothing skipped.
  abi-seam:
    needs: contracts-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: contracts-out
          path: contracts/out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (shared + agent workspaces — viem for the seam scripts)
        run: npm install -w @zyo/shared -w @zyo/agent
      - name: Root ABI seam — committed bundle equals the compiled artifacts
        run: node scripts/verify-abi.mjs
      - name: Build shared and the keeper (its seam imports agent/dist)
        run: |
          npm run build -w @zyo/shared
          npm run build -w @zyo/agent
      - name: Keeper ABI seam, STRICT — a missing artifact is a failure, never a skip
        run: node agent/scripts/verify-abi.mjs
        env:
          VERIFY_ABI_STRICT: "1"

  agent:
    needs: contracts-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: contracts-out
          path: contracts/out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (shared + agent + yield workspaces)
        run: npm install -w @zyo/shared -w @zyo/agent -w @zyo/yield
      # agent and yield import @zyo/shared's compiled dist/ — a fresh runner
      # has none, so build it first (this missing step failed every run
      # 2026-08-14 → 2026-08-27).
      - name: Build shared
        run: npm run build -w @zyo/shared
      - name: Keeper suite (tsc + verify-abi STRICT + node:test)
        run: npm test -w @zyo/agent
        env:
          VERIFY_ABI_STRICT: "1"
      - name: Yield service suite (tsc + node:test, offline fixtures)
        run: npm test -w @zyo/yield

  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shared
        run: npm install -w @zyo/shared
      - name: Shared suite (tsc build + node:test — the ladder, the tables, the per-chain rows, the Solana rows)
        run: npm test -w @zyo/shared

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (shared + web workspaces)
        run: npm install -w @zyo/shared -w @zyo/web
      - name: Build shared
        run: npm run build -w @zyo/shared
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck -w @zyo/web
      - name: Publish the model doc where the demo-gate pin looks for it (else that test skips)
        run: |
          mkdir -p /tmp/build
          cp services/yield/samples/MODEL-NUMBERS.md /tmp/build/MODEL-NUMBERS.md
      - name: Web unit suite (node:test; the ABI-drift test and both model-number pins must RUN)
        run: npm test -w @zyo/web
        env:
          VERIFY_ABI_STRICT: "1"

  # The two static prototypes, driven by Playwright's Chromium. verify-toggle deep-equals the pages'
  # shared block against the BUILT @zyo/shared and pins OIL_MODEL to /tmp/build/MODEL-NUMBERS.md
  # when that file exists — so the repo's copy is put there, and the pin runs instead of skipping.
  prototypes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (shared + web workspaces — Playwright comes with the web workspace)
        run: npm install -w @zyo/shared -w @zyo/web
      - name: Build shared
        run: npm run build -w @zyo/shared
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prototype suites (verify-simple, verify-advanced, verify-toggle, fuzz)
        run: |
          mkdir -p /tmp/build
          cp services/yield/samples/MODEL-NUMBERS.md /tmp/build/MODEL-NUMBERS.md
          CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" node prototype/test/run-all.mjs
      # Slice J: the web against a LIVE Base Sepolia deployment. Skips BY NAME (3 skipped, exit 0)
      # while docs/DEPLOYMENTS.md holds no addresses; the day the table is filled this step starts
      # `next dev` on 84532 with those addresses and runs the three rehearsal checks for real.
      - name: Sepolia rehearsal suite (skips by name until DEPLOYMENTS.md has addresses)
        run: npx playwright test -c playwright.sepolia.config.ts
        working-directory: web

  # Base mainnet at the pinned block: the tests that can only be true against the chain. The RPC is
  # `secrets.BASE_RPC_URL` (never printed; GitHub masks it in logs). Without it every test is
  # `vm.skip`ped — and this job then FAILS with "<n> skipped = NOT VERIFIED" as its own summary line,
  # because a green check over skipped fork tests would be a lie. With it, the job also runs the
  # cbZEC B20 check that no fork EVM can execute (scripts/check-cbzec-b20.sh) at the same block.
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    env:
      FORK_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fetch libraries (not vendored in repo)
        run: |
          git clone --depth 1 --branch "$OZ_TAG" https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 --branch "$FORGE_STD_TAG" https://github.com/foundry-rs/forge-std lib/forge-std
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: |
            contracts/cache
            contracts/out
          key: foundry-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/src/**/*.sol', 'contracts/test/**/*.sol', 'contracts/script/**/*.sol') }}
          restore-keys: foundry-${{ runner.os }}-
      - name: Fork suite at FORK_BLOCK (fails, and says NOT VERIFIED, without the secret)
        run: |
          set -o pipefail
          forge test --match-path test/fork/BaseFork.t.sol -vv 2>&1 | tee fork.log || true
          # Foundry's closing line: "Ran 1 test suite in …: P tests passed, F failed, S skipped (T total tests)"
          TOTALS=$(sed -n 's/^Ran [0-9]* test suites\{0,1\} in .*: \([0-9]*\) tests\{0,1\} passed, \([0-9]*\) failed, \([0-9]*\) skipped (\([0-9]*\) total tests\{0,1\}).*/\1 \2 \3 \4/p' fork.log | tail -1)
          if [ -z "$TOTALS" ]; then
            echo "::error::fork: forge printed no totals line — the suite did not run to the end (see fork.log)"
            echo "### fork: NOT VERIFIED — the suite did not run to the end" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          read -r PASSED FAILED SKIPPED TOTAL <<< "$TOTALS"
          if [ -z "$FORK_URL" ]; then
            LINE="fork: ${SKIPPED} skipped = NOT VERIFIED (secrets.BASE_RPC_URL is not available to this run; nothing about Base mainnet was checked)"
            echo "$LINE"
            echo "### $LINE" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$LINE"
            exit 1
          fi
          TIP=$(cast block-number --rpc-url "$FORK_URL" || echo "unknown")
          LINE="fork: ${PASSED} passed / ${FAILED} failed / ${SKIPPED} skipped of ${TOTAL} at block ${FORK_BLOCK} (chain tip at run time: ${TIP})"
          echo "$LINE"
          echo "### $LINE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" -ne 0 ]; then echo "::error::$LINE"; exit 1; fi
          # With the secret present a skip means a live entry the suite looks for has vanished —
          # reported, not hidden.
          if [ "$SKIPPED" -ne 0 ]; then
            echo "::warning::fork: ${SKIPPED} test(s) skipped WITH the RPC present — an entry the suite selects by property is gone; read fork.log"
            echo "- ${SKIPPED} skipped with the RPC present: NOT fully verified — see fork.log" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: cbZEC B20 shape at FORK_BLOCK — the check no fork EVM can run (cast against the RPC)
        run: |
          ../scripts/check-cbzec-b20.sh "$FORK_URL" "$FORK_BLOCK" | tee cbzec-b20.log
          echo "- $(head -1 cbzec-b20.log)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the fork log (console output of every fork test, and the B20 read)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-at-${{ env.FORK_BLOCK }}
          path: |
            contracts/fork.log
            contracts/cbzec-b20.log
          if-no-files-found: ignore

  # Slice H (2026-09-11, BASE-PIVOT item 20): static analysis and symbolic execution on every push.
  # The job FAILS on a new High from Slither (`--fail-high`) or Aderyn (the report's high_issues), and
  # on a violated halmos property of the account's grant budget / calldata parser. The router balance
  # property runs with `continue-on-error`: it walks the whole unwind tree and is expected to time out
  # rather than to fail (AUDIT-2026-09-11.md §Slice H).
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fetch libraries (not vendored in repo)
        run: |
          git clone --depth 1 --branch "$OZ_TAG" https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 --branch "$FORGE_STD_TAG" https://github.com/foundry-rs/forge-std lib/forge-std
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: |
            contracts/cache
            contracts/out
          key: foundry-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/src/**/*.sol', 'contracts/test/**/*.sol', 'contracts/script/**/*.sol') }}
          restore-keys: foundry-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Slither (fails on High)
        run: |
          python3 -m pip install --quiet slither-analyzer
          slither . --filter-paths "lib/|test/|script/" --exclude-dependencies --fail-high --sarif slither.sarif || exit 1
      - name: Aderyn (fails on High)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cyfrin/aderyn/releases/latest/download/aderyn-installer.sh | bash
          export PATH="$HOME/.local/bin:$HOME/.cyfrin/bin:$PATH"
          aderyn . --src src/ -o aderyn.json
          HIGHS=$(python3 -c 'import json;d=json.load(open("aderyn.json"));print(len((d.get("high_issues") or {}).get("issues") or []))')
          echo "Aderyn high issues: $HIGHS"
          test "$HIGHS" -eq 0
      # Both halmos steps compile under FOUNDRY_PROFILE=halmos (foundry.toml: test = "test/halmos"), so
      # forge builds src + the two harnesses instead of every test contract — the full via-IR compile
      # is what ended the first halmos run with the runner's shutdown signal (2026-09-12, CHANGELOG).
      - name: Halmos — the account's grant budget and calldata parser (fails on a violated property)
        env:
          FOUNDRY_PROFILE: halmos
        run: |
          python3 -m pip install --quiet halmos
          halmos --contract AccountGrantHalmos --loop 4 --solver-timeout-assertion 120000
      - name: Halmos — the router's balance unchanged across unwind (bounded; may time out)
        continue-on-error: true
        env:
          FOUNDRY_PROFILE: halmos
        run: |
          timeout 20m halmos --contract RouterBalanceHalmos --loop 3 --solver-timeout-assertion 60000 || echo "router property: timed out or unknown — recorded, not a failure"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            contracts/slither.sarif
            contracts/aderyn.json
          if-no-files-found: ignore

  solana-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The seam test imports only @zyo/shared and node builtins: no Rust, no Solana CLI, no validator.
      - name: Install shared
        run: npm install -w @zyo/shared
      - name: Build shared
        run: npm run build -w @zyo/shared
      - name: Ladder seam (generated/ladder.rs == packages/shared)
        run: npm test -w @zyo/solana

  # The Solana program with the real toolchain (2026-09-13): Rust 1.98.1 (the version the program was first
  # built with, solana/SETUP.md), Agave 4.2.2 from release.anza.xyz, anchor-cli 1.2.0 from crates.io (the
  # `solana-foundation/anchor` GitHub repository redirects today, so the crate is the stable source). Proves:
  # the generated constants equal packages/shared, `anchor build` compiles both programs, the host unit tests
  # pass, and the COMMITTED IDL (solana/idl, which the keeper's 77-check seam is pinned to) equals the build.
  # The localnet specs (26) are NOT run here: they clone the ZCASH market from mainnet through a public RPC
  # that rate-limits a runner; solana/SETUP.md is the way to run them. Cold run ≈ 25 min (anchor-cli compile);
  # warm runs reuse the cargo and anchor caches.
  solana-program:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shared + solana workspaces
        run: npm install -w @zyo/shared -w @zyo/solana
      - name: Build shared
        run: npm run build -w @zyo/shared
      - name: Generated constants equal packages/shared (ladder + addresses)
        run: node solana/scripts/gen-ladder.mjs --check && node solana/scripts/gen-addresses.mjs --check
      - name: Rust 1.98.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana -> target
          cache-on-failure: true
      - name: Solana CLI (Agave 4.2.2)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Cache anchor-cli 1.2.0
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-1.2.0-${{ runner.os }}-rust-1.98.1
      - name: Install anchor-cli 1.2.0 (crates.io)
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install anchor-cli --version 1.2.0 --locked
      - name: Versions
        run: rustc --version && solana --version && anchor --version
      - name: anchor build (oilskin + mock_scope)
        working-directory: solana
        run: anchor build
      - name: Program host unit tests (health.rs, keeper_protect.rs)
        working-directory: solana
        run: cargo test --manifest-path programs/oilskin/Cargo.toml --lib
      - name: Committed IDL equals the build (solana/idl — the keeper's seam is pinned to it)
        run: node solana/scripts/sync-idl.mjs --check
