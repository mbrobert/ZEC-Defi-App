<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Oilskin mark: the shed line. Rain beads and rolls off a waxed shoulder —
       your ZEC stays dry underneath, still working. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#A6432C"/>
  <!-- the shoulder / shed line -->
  <path d="M10 22 C 22 20, 34 26, 54 46" fill="none" stroke="#FBF6EC" stroke-width="5" stroke-linecap="round"/>
  <!-- the bead of water, sitting proud on the slope -->
  <circle cx="30" cy="20.5" r="6.5" fill="#FBF6EC"/>
  <circle cx="32.2" cy="18.6" r="1.8" fill="#A6432C" opacity=".35"/>
  <!-- run-off beads -->
  <circle cx="50" cy="51" r="2.6" fill="#FBF6EC" opacity=".85"/>
  <circle cx="57" cy="57" r="1.7" fill="#FBF6EC" opacity=".6"/>
</svg>
